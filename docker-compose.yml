version: '3.8'

# Redis is Amazon ElastiCache (infra/elasticache-waf.yml), not a container here.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: Orbit
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg-data:
